ates {
  server {
    port = 10003
    port = ${?ATES_SERVER_PORT}
  }
  database {
    url = "jdbc:postgresql://localhost:5432/ates_task"
    url = ${?ATES_DB_URL}
    user = "ates"
    user = ${?ATES_DB_USER}
    password = "ates"
    password = ${?ATES_DB_PASSWORD}
    maxPoolSize = 10
    maxPoolSize = ${?ATES_DB_MAX_POOL}
  }
  kafka {
    bootstrapServers = ["localhost:29092"]
    bootstrapServers = ${?ATES_KAFKA_BOOTSTRAP_SERVERS}
    consumerGroupId = "ates-task-service"
    consumerGroupId = ${?ATES_KAFKA_CONSUMER_GROUP}
    topicUserCreated = "auth.user.created"
    topicUserCreated = ${?ATES_KAFKA_TOPIC_USER_CREATED}
    topicTaskCreated = "task.created"
    topicTaskCreated = ${?ATES_KAFKA_TOPIC_TASK_CREATED}
    topicTaskAssigned = "task.assigned"
    topicTaskAssigned = ${?ATES_KAFKA_TOPIC_TASK_ASSIGNED}
    topicTaskCompleted = "task.completed"
    topicTaskCompleted = ${?ATES_KAFKA_TOPIC_TASK_COMPLETED}
  }
  outbox {
    batchSize = 50
    batchSize = ${?ATES_OUTBOX_BATCH_SIZE}
    pollIntervalSeconds = 2
    pollIntervalSeconds = ${?ATES_OUTBOX_POLL_INTERVAL}
  }
}