ates {
  server {
    port = 10001
    port = ${?ATES_SERVER_PORT}
  }
  database {
    url = "jdbc:postgresql://localhost:5432/ates"
    url = ${?ATES_DB_URL}
    user = "ates"
    user = ${?ATES_DB_USER}
    password = "ates"
    password = ${?ATES_DB_PASSWORD}
    maxPoolSize = 10
    maxPoolSize = ${?ATES_DB_MAX_POOL}
  }
  kafka {
    bootstrapServers = ["localhost:29092"]
    bootstrapServers = ${?ATES_KAFKA_BOOTSTRAP_SERVERS}
    topicUserCreated = "auth.user.created"
    topicUserCreated = ${?ATES_KAFKA_TOPIC_USER_CREATED}
  }
  jwt {
    issuer = "ates-auth"
    issuer = ${?ATES_JWT_ISSUER}
    accessTtlSeconds = 900
    accessTtlSeconds = ${?ATES_JWT_ACCESS_TTL}
    refreshTtlSeconds = 604800
    refreshTtlSeconds = ${?ATES_JWT_REFRESH_TTL}
  }
  outbox {
    batchSize = 50
    batchSize = ${?ATES_OUTBOX_BATCH_SIZE}
    pollIntervalSeconds = 2
    pollIntervalSeconds = ${?ATES_OUTBOX_POLL_INTERVAL}
  }
}