ates {
  server {
    port = 10006
    port = ${?ATES_SERVER_PORT}
  }
  database {
    url = "jdbc:postgresql://localhost:5432/ates_notification"
    url = ${?ATES_DB_URL}
    user = "ates"
    user = ${?ATES_DB_USER}
    password = "ates"
    password = ${?ATES_DB_PASSWORD}
    maxPoolSize = 10
    maxPoolSize = ${?ATES_DB_MAX_POOL}
  }
  kafka {
    bootstrapServers = ["localhost:29092"]
    bootstrapServers = ${?ATES_KAFKA_BOOTSTRAP_SERVERS}
    consumerGroupId = "ates-notification"
    consumerGroupId = ${?ATES_KAFKA_CONSUMER_GROUP}
    topicTaskAssigned = "task.assigned"
    topicTaskAssigned = ${?ATES_KAFKA_TOPIC_TASK_ASSIGNED}
    topicTaskCompleted = "task.completed"
    topicTaskCompleted = ${?ATES_KAFKA_TOPIC_TASK_COMPLETED}
    topicPaymentProcessed = "accounting.payment.processed"
    topicPaymentProcessed = ${?ATES_KAFKA_TOPIC_PAYMENT_PROCESSED}
    topicDlq = "notification.dlq"
    topicDlq = ${?ATES_KAFKA_TOPIC_DLQ}
  }
  channels {
    telegram {
      botToken = ""
      botToken = ${?ATES_CHANNELS_TELEGRAM_BOT_TOKEN}
      adminAddresses = ""
      adminAddresses = ${?ATES_CHANNELS_TELEGRAM_ADMIN_ADDRESSES}
      rateLimitPerSecond = 25
      rateLimitPerSecond = ${?ATES_CHANNELS_TELEGRAM_RATE_LIMIT_PER_SECOND}
      sendTimeoutSeconds = 10
      sendTimeoutSeconds = ${?ATES_CHANNELS_TELEGRAM_SEND_TIMEOUT_SECONDS}
      retryAttempts = 5
      retryAttempts = ${?ATES_CHANNELS_TELEGRAM_RETRY_ATTEMPTS}
    }
  }
}
