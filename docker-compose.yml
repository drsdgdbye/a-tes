services:
  postgres:
    image: postgres:16
    container_name: ates-postgres
    environment:
      POSTGRES_USER: ates
      POSTGRES_PASSWORD: ates
      POSTGRES_DB: ates
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ates -d ates"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      ates-net:
        ipv4_address: 172.30.0.10

  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.0
    container_name: ates-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      ates-net:
        ipv4_address: 172.30.0.11

  kafka:
    image: confluentinc/cp-kafka:7.7.0
    container_name: ates-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:29092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    networks:
      ates-net:
        ipv4_address: 172.30.0.12

  schema-registry:
    image: confluentinc/cp-schema-registry:7.7.0
    container_name: ates-schema-registry
    depends_on:
      - kafka
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    networks:
      ates-net:
        ipv4_address: 172.30.0.13

  jaeger:
    image: jaegertracing/all-in-one:1.60
    container_name: ates-jaeger
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    networks:
      ates-net:
        ipv4_address: 172.30.0.14

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: ates-prometheus
    depends_on:
      - postgres
      - kafka
      - jaeger
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      ates-net:
        ipv4_address: 172.30.0.15

  grafana:
    image: grafana/grafana:11.2.0
    container_name: ates-grafana
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      ates-net:
        ipv4_address: 172.30.0.16

  auth:
    image: ates-auth:latest
    container_name: ates-auth
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "10001:10001"
    environment:
      ATES_SERVER_PORT: 10001
      ATES_DB_URL: jdbc:postgresql://postgres:5432/ates_auth
      ATES_DB_USER: ates
      ATES_DB_PASSWORD: ates
      ATES_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    networks:
      ates-net:
        ipv4_address: 172.30.0.17

  gateway:
    image: ates-gateway:latest
    container_name: ates-gateway
    depends_on:
      auth:
        condition: service_started
      task-service:
        condition: service_started
    ports:
      - "10002:10002"
    environment:
      ATES_SERVER_PORT: 10002
      ATES_JWT_KEYS_URL: http://auth:10001/auth/keys
      ATES_SERVICES_AUTH_BASE_URL: http://auth:10001
      ATES_SERVICES_TASK_SERVICE_BASE_URL: http://task-service:10003
      ATES_SERVICES_ACCOUNTING_BASE_URL: http://accounting:10004
      ATES_SERVICES_ANALYTICS_BASE_URL: http://analytics:10005
    networks:
      ates-net:
        ipv4_address: 172.30.0.18

  task-service:
    image: ates-task-service:latest
    container_name: ates-task-service
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "10003:10003"
    environment:
      ATES_SERVER_PORT: 10003
      ATES_DB_URL: jdbc:postgresql://postgres:5432/ates_task
      ATES_DB_USER: ates
      ATES_DB_PASSWORD: ates
      ATES_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    networks:
      ates-net:
        ipv4_address: 172.30.0.19

  accounting:
    image: ates-accounting:latest
    container_name: ates-accounting
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "10004:10004"
    environment:
      ATES_SERVER_PORT: 10004
      ATES_DB_URL: jdbc:postgresql://postgres:5432/ates_accounting
      ATES_DB_USER: ates
      ATES_DB_PASSWORD: ates
      ATES_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    networks:
      ates-net:
        ipv4_address: 172.30.0.20

  analytics:
    image: ates-analytics:latest
    container_name: ates-analytics
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "10005:10005"
    environment:
      ATES_SERVER_PORT: 10005
      ATES_DB_URL: jdbc:postgresql://postgres:5432/ates_analytics
      ATES_DB_USER: ates
      ATES_DB_PASSWORD: ates
      ATES_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    networks:
      ates-net:
        ipv4_address: 172.30.0.21

  notification:
    image: ates-notification:latest
    container_name: ates-notification
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "10006:10006"
    environment:
      ATES_SERVER_PORT: 10006
      ATES_DB_URL: jdbc:postgresql://postgres:5432/ates_notification
      ATES_DB_USER: ates
      ATES_DB_PASSWORD: ates
      ATES_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      ATES_CHANNELS_TELEGRAM_BOT_TOKEN: ${ATES_CHANNELS_TELEGRAM_BOT_TOKEN:-}
      ATES_CHANNELS_TELEGRAM_ADMIN_ADDRESSES: ${ATES_CHANNELS_TELEGRAM_ADMIN_ADDRESSES:-}
    networks:
      ates-net:
        ipv4_address: 172.30.0.22

  frontend:
    image: ates-frontend:latest
    build:
      context: ./frontend
    container_name: ates-frontend
    depends_on:
      - gateway
    ports:
      - "80:80"
    networks:
      ates-net:
        ipv4_address: 172.30.0.23

volumes:
  postgres-data:
  grafana-data:

networks:
  ates-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
