ates {
  server {
    port = 10002
    port = ${?ATES_SERVER_PORT}
  }
  jwt {
    issuer = "ates-auth"
    issuer = ${?ATES_JWT_ISSUER}
    keysUrl = "http://localhost:10001/auth/keys"
    keysUrl = ${?ATES_JWT_KEYS_URL}
    refreshIntervalSeconds = 60
    refreshIntervalSeconds = ${?ATES_JWT_KEYS_REFRESH_INTERVAL}
    startupRetryIntervalSeconds = 2
    startupRetryIntervalSeconds = ${?ATES_JWT_KEYS_STARTUP_RETRY_INTERVAL}
  }
  services {
    auth {
      baseUrl = "http://localhost:10001"
      baseUrl = ${?ATES_SERVICES_AUTH_BASE_URL}
    }
    taskService {
      baseUrl = "http://localhost:10003"
      baseUrl = ${?ATES_SERVICES_TASK_SERVICE_BASE_URL}
    }
    accounting {
      baseUrl = "http://localhost:10004"
      baseUrl = ${?ATES_SERVICES_ACCOUNTING_BASE_URL}
    }
    analytics {
      baseUrl = "http://localhost:10005"
      baseUrl = ${?ATES_SERVICES_ANALYTICS_BASE_URL}
    }
  }
  resilience {
    circuitBreaker {
      maxFailures = 5
      maxFailures = ${?ATES_RESILIENCE_CB_MAX_FAILURES}
      resetIntervalSeconds = 30
      resetIntervalSeconds = ${?ATES_RESILIENCE_CB_RESET_INTERVAL}
    }
    retry {
      maxRetries = 3
      maxRetries = ${?ATES_RESILIENCE_RETRY_MAX}
      initialDelayMillis = 100
      initialDelayMillis = ${?ATES_RESILIENCE_RETRY_INITIAL_DELAY}
      backoffFactor = 2.0
      backoffFactor = ${?ATES_RESILIENCE_RETRY_BACKOFF_FACTOR}
    }
    timeLimiter {
      readTimeoutSeconds = 5
      readTimeoutSeconds = ${?ATES_RESILIENCE_TIMEOUT_READ}
      writeTimeoutSeconds = 10
      writeTimeoutSeconds = ${?ATES_RESILIENCE_TIMEOUT_WRITE}
    }
    bulkhead {
      maxConcurrent = 20
      maxConcurrent = ${?ATES_RESILIENCE_BULKHEAD_MAX}
    }
    rateLimiter {
      rps = 200
      rps = ${?ATES_RESILIENCE_RATELIMIT_RPS}
    }
  }
}