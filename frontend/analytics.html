<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>aTES — Аналитика</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar" id="navbar"></nav>

  <div class="container">
    <div id="message" class="alert"></div>

    <div class="card">
      <h2>Доход менеджмента</h2>
      <form id="mgmt-form">
        <label for="mgmt-from">С</label>
        <input type="date" id="mgmt-from" required>
        <label for="mgmt-to">По</label>
        <input type="date" id="mgmt-to" required>
        <button type="submit" class="btn-small btn">Показать</button>
      </form>
      <table>
        <thead>
          <tr>
            <th>Дата</th>
            <th>Доход</th>
          </tr>
        </thead>
        <tbody id="mgmt-body"></tbody>
      </table>
      <div id="mgmt-total" class="muted" style="margin-top: 8px"></div>
    </div>

    <div class="grid-2">
      <div class="card">
        <h2>Попуги в минусе</h2>
        <table>
          <thead>
            <tr>
              <th>Имя</th>
              <th>Баланс</th>
            </tr>
          </thead>
          <tbody id="minus-body"></tbody>
        </table>
        <div id="minus-empty" class="empty" style="display:none">Попугов в минусе нет</div>
      </div>

      <div class="card">
        <h2>Самая дорогая задача</h2>
        <form id="expensive-form">
          <label for="expensive-period">Период</label>
          <select id="expensive-period">
            <option value="day">День</option>
            <option value="week">Неделя</option>
            <option value="month">Месяц</option>
          </select>
          <label for="expensive-date">Опорная дата</label>
          <input type="date" id="expensive-date" required>
          <button type="submit" class="btn-small btn">Показать</button>
        </form>
        <table>
          <thead>
            <tr>
              <th>Дата</th>
              <th>Задача</th>
              <th>Сумма</th>
            </tr>
          </thead>
          <tbody id="expensive-body"></tbody>
        </table>
        <div id="expensive-overall" class="muted" style="margin-top: 8px"></div>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/common.js"></script>
  <script src="js/analytics.js"></script>
</body>
</html>
